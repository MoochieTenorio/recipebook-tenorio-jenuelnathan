{% extends "base.html" %}

{% block title %}Login{% endblock %}
{% block page_heading %}Login to Recipe Book{% endblock %}

{% block content %}

        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Login</button>
    </form>
    <p><a href="{% url 'password_reset' %}">Forgot password?</a></p>
{% endblock %}
