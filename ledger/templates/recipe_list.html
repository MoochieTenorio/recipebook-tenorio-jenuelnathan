{% extends "base.html" %}

{% block title %}Recipe List{% endblock %}
{% block page_heading %}Available Recipes{% endblock %}

{% block content %}
    <ul>
        {% for recipe in recipes %}
            <li>
                <a href="{% url 'recipe_detail' recipe.id %}">{{ recipe.name }}</a>
            </li>
        {% endfor %}
    </ul>
{% endblock %}
